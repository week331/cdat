     name: verify
     on:
       push:
       pull_request:
       workflow_dispatch:
     jobs:
       verify:
         runs-on: ubuntu-latest
         steps:
           - uses: actions/checkout@v4
           - uses: actions/setup-python@v5
             with:
               python-version: "3.11"
           - name: 論文の数値を再現し、期待される出力と比べる
             run: sh verification/run_all.sh
